#logging
logging.level.org=ERROR
spring.output.ansi.enabled=ALWAYS
logging.level.com.c2.lc.ms=DEBUG
logging.level.org.apache.kafka=WARN
logging.pattern.console = %clr(%d{yyyy-MM-dd HH:mm:ss.SSS, IST}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx